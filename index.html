<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar do Lucro PRO</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-color: #10b981; /* Verde esmeralda premium */
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #34d399, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-group input:focus + label {
            color: var(--primary-color);
        }

        .input-group input::placeholder {
            color: #475569;
        }

        .btn-calcular {
            width: 100%;
            background: var(--primary-color);
            color: #020617;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .btn-calcular:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-calcular:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .error-msg {
            color: var(--error);
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }

        .result-container {
            margin-top: 30px;
            padding: 24px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            text-align: center;
            display: none; /* Escondido até calcular */
            animation: slideUp 0.5s ease forwards;
        }

        .result-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 38px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .result-footer {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="header">
            <h1>Radar do Lucro</h1>
            <p>Descubra o custo exato do seu KM rodado</p>
        </div>
        
        <div class="input-group">
            <label for="aluguel">Aluguel ou Parcela do Carro (R$)</label>
            <input type="number" id="aluguel" inputmode="decimal" step="0.01" placeholder="Ex: 3000,00">
        </div>

        <div class="input-group">
            <label for="dias">Dias trabalhados no mês</label>
            <input type="number" id="dias" inputmode="numeric" placeholder="Ex: 26">
        </div>

        <div class="input-group">
            <label for="km_dia">Média de KM rodados por dia</label>
            <input type="number" id="km_dia" inputmode="numeric" placeholder="Ex: 150">
        </div>

        <div class="input-group">
            <label for="combustivel">Preço do Combustível (R$)</label>
            <input type="number" id="combustivel" inputmode="decimal" step="0.01" placeholder="Ex: 5,50">
        </div>

        <div class="input-group">
            <label for="consumo">Consumo médio (KM por Litro)</label>
            <input type="number" id="consumo" inputmode="decimal" step="0.1" placeholder="Ex: 11,5">
        </div>

        <div id="error-msg" class="error-msg">Por favor, preencha todos os campos corretamente.</div>

        <button class="btn-calcular" onclick="calcular()">Calcular Agora</button>

        <div class="result-container" id="result-container">
            <div class="result-title">Seu custo real é de</div>
            <div class="result-value" id="resultado">R$ 0,00</div>
            <div class="result-footer">Este é o valor que sai do seu bolso a cada KM. <strong>Recuse corridas pagando menos que isso.</strong></div>
        </div>
    </div>

    <script>
        function calcular() {
            // Coletando os valores (substituindo vírgula por ponto para evitar erros de digitação do usuário)
            const aluguel = parseFloat(document.getElementById('aluguel').value.replace(',', '.')) || 0;
            const dias = parseFloat(document.getElementById('dias').value.replace(',', '.')) || 0;
            const km_dia = parseFloat(document.getElementById('km_dia').value.replace(',', '.')) || 0;
            const combustivel = parseFloat(document.getElementById('combustivel').value.replace(',', '.')) || 0;
            const consumo = parseFloat(document.getElementById('consumo').value.replace(',', '.')) || 0;

            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');

            // Validação: checa se todos os campos foram preenchidos e são maiores que zero
            if (!aluguel || !dias || !km_dia || !combustivel || !consumo) {
                errorMsg.style.display = 'block';
                resultContainer.style.display = 'none';
                return;
            }

            // Esconde o erro se tudo estiver certo
            errorMsg.style.display = 'none';

            // Cálculos
            const custoFixoPorKm = aluguel / (dias * km_dia);
            const custoVariavelPorKm = combustivel / consumo;
            const custoTotal = custoFixoPorKm + custoVariavelPorKm;

            // Formatação do resultado para o padrão brasileiro
            const formatoBRL = custoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            
            // Exibindo o resultado com animação
            document.getElementById('resultado').innerText = formatoBRL;
            resultContainer.style.display = 'block';
            
            // Rola a tela suavemente para baixo para o usuário ver o resultado no mobile
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
